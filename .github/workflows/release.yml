name: Release

# Tag-driven: `git tag v1.2.3 && git push --tags` is the whole release ritual.
# The tag is the version — it is written into Info.plist, the pkg, the extension
# manifest and the host's own `hello` reply, and the job refuses to build if
# those disagree with it (see "Check the version is consistent").
on:
  push:
    tags: ['v*']
  # Buildable without publishing, so the packaging can be exercised on a branch
  # before a tag makes it permanent. Signs and notarizes exactly the same way —
  # the only difference is that nothing is released at the end.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no leading v)'
        required: true
        default: '0.0.0-dev'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building $V"

      - name: Check the version is consistent
        # The version lives in four places that must agree: the tag, the
        # extension manifest, its package.json, and the host's hostVersion —
        # which the PAGE compares against its own minimum to decide whether to
        # tell someone their helper is out of date. A release where those drift
        # ships a helper that reports the wrong version of itself, and the
        # symptom is an install prompt that will not go away.
        run: node scripts/check-version.mjs "${{ steps.v.outputs.version }}"

      - name: Install SoftHSM and the PKCS #11 tools
        run: brew install softhsm opensc

      - name: Build a throwaway token
        run: ./scripts/softhsm-token.sh "$RUNNER_TEMP/softhsm" >> "$GITHUB_ENV"

      # A release that has not passed the checks is not a release. Same suite CI
      # runs on every push; repeated here because the tag is what people install.
      - name: Check the agent
        working-directory: agent
        run: swift run signbridge-check

      - name: Check the extension
        working-directory: extension
        run: npm ci && npm run check

      - name: Import the Developer ID certificates
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          # A keychain of its own, deleted with the runner. The default login
          # keychain on a hosted runner is not somewhere to put a signing key.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          # Without this, codesign blocks on a GUI prompt nobody can answer and
          # the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/certs.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build and sign the app
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: ./packaging/build-app.sh "${{ steps.v.outputs.version }}"

      - name: Notarize and staple the app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: ./packaging/notarize.sh build/SignBridge.app

      - name: Build and sign the installer
        env:
          INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: ./packaging/build-pkg.sh "${{ steps.v.outputs.version }}"

      - name: Notarize and staple the installer
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        # The pkg is stapled too, not just the app inside it. A stapled app in
        # an unstapled installer still shows a Gatekeeper warning at the point
        # people actually see it: the moment they double-click the download.
        run: ./packaging/notarize.sh build/SignBridge.pkg

      - name: Verify what is about to be published
        # The last chance to catch a release that installs and then dies. Reads
        # the artifacts rather than the intent that produced them.
        run: ./packaging/verify-release.sh build/SignBridge.pkg build/SignBridge.app

      - name: Package the extension
        working-directory: extension
        run: |
          npm run build
          cd dist && zip -r "$GITHUB_WORKSPACE/build/sign-bridge-extension-${{ steps.v.outputs.version }}.zip" .

      - name: Checksums
        working-directory: build
        run: shasum -a 256 SignBridge.pkg *.zip | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sign-bridge-${{ steps.v.outputs.version }}
          path: |
            build/SignBridge.pkg
            build/*.zip
            build/SHA256SUMS.txt

      - name: Publish the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        # The extension zip is attached but NOT published to the store from
        # here: the Chrome Web Store is a review queue with a human on the other
        # end, and a tag push is the wrong trigger for joining one. See
        # docs/RELEASING.md.
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Sign Bridge ${{ steps.v.outputs.version }}" \
            --generate-notes \
            build/SignBridge.pkg \
            build/sign-bridge-extension-${{ steps.v.outputs.version }}.zip \
            build/SHA256SUMS.txt
